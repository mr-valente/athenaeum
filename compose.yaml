name: athenaeum

# Shared container defaults; each service below adds its image and data.
x-runtime: &runtime
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  edge:
    <<: *runtime
    image: ${EDGE_IMAGE:-valentemath/athenaeum:latest-edge}
    user: ${RUNTIME_UID:-10001}:${RUNTIME_GID:-10001}
    mem_limit: 256m
    ports:
      - '80:8080'
      - '443:8443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-valentemath.com}
      ACME_EMAIL: ${ACME_EMAIL:?Set the ACME contact email}
      SABLIER_GROUP_PREFIX: ${COMPOSE_PROJECT_NAME:-athenaeum}
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/srv/athenaeum}/edge/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${DATA_ROOT:-/srv/athenaeum}/edge/config
        target: /config
        bind: {create_host_path: false}
    networks: [default, apps, control]

  socket-proxy:
    <<: *runtime
    # The only service holding the Docker socket. HAProxy forwards Sablier just
    # what a stop-strategy lifecycle manager needs (list, inspect, start, stop,
    # events, ping, version); create, exec, logs, images and volumes stay denied,
    # so a compromised Sablier cannot reach the host through the socket.
    image: lscr.io/linuxserver/socket-proxy:3.4.4-r0-ls97@sha256:ba211325155c463a1a6e6a038c928f21447a8e60ce02ecf41302047974097e84
    mem_limit: 64m
    environment:
      CONTAINERS: '1'
      ALLOW_START: '1'
      ALLOW_STOP: '1'
      POST: '0'
      LOG_LEVEL: warning
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {create_host_path: false}
    tmpfs:
      # The entrypoint renders haproxy.cfg here; nothing else is written.
      - /run:size=1048576,mode=0755,noexec,nosuid,nodev
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2375/_ping]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [socket]

  sablier:
    <<: *runtime
    image: sablierapp/sablier:1.18.0
    mem_limit: 128m
    command: [start, --configFile=/etc/sablier/sablier.yaml]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
    depends_on:
      socket-proxy: {condition: service_healthy}
    volumes:
      - type: bind
        source: ./deploy/sablier/sablier.yaml
        target: /etc/sablier/sablier.yaml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./deploy/sablier/themes
        target: /etc/sablier/themes
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./design
        target: /etc/sablier/themes/assets
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /bin/sablier, health]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [control, socket]

  athenaeum:
    <<: *runtime
    image: ${ATHENAEUM_IMAGE:-valentemath/athenaeum:latest}
    mem_limit: 256m
    networks: [apps]

  accounts:
    <<: *runtime
    image: ${ACCOUNTS_IMAGE:-valentemath/athenaeum:latest-accounts}
    user: ${RUNTIME_UID:-10001}:${RUNTIME_GID:-10001}
    mem_limit: 256m
    environment:
      APP_ENV: production
      ACCOUNT_ORIGIN: ${ACCOUNT_ORIGIN:-https://valentemath.com}
      DB_PATH: /data/app.db
      SESSION_SECRET_FILE: /run/secrets/accounts_session
      ACCOUNTS_APP_SECRETS: '{"bernoulli":"/run/secrets/bernoulli_session","quacktuaries":"/run/secrets/quacktuaries_session","srs":"/run/secrets/srs_session"}'
      FORWARDED_ALLOW_IPS: '*'
    secrets: [accounts_session, bernoulli_session, quacktuaries_session, srs_session]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/srv/athenaeum}/apps/accounts/data
        target: /data
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:size=16777216,mode=1777,noexec,nosuid,nodev
    # Identity infrastructure stays awake and needs outbound HTTPS to Google.
    networks: [apps, default]

  quacktuaries:
    <<: *runtime
    labels:
      sablier.enable: 'true'
      sablier.group: ${COMPOSE_PROJECT_NAME:-athenaeum}-quacktuaries
    image: ${QUACKTUARIES_IMAGE:-valentemath/quacktuaries:latest-athenaeum}
    user: ${RUNTIME_UID:-10001}:${RUNTIME_GID:-10001}
    mem_limit: 1g
    environment:
      APP_ENV: production
      ROOT_PATH: /quacktuaries
      PORT: '8000'
      DB_PATH: /data/app.db
      SESSION_SECRET_FILE: /run/secrets/quacktuaries_session
      ACCOUNT_SERVICE_URL: http://accounts:8000
      ATHENAEUM_APP_ID: quacktuaries
      # Only our trusted containers can reach this unpublished app port.
      FORWARDED_ALLOW_IPS: '*'
    secrets: [quacktuaries_session]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/srv/athenaeum}/apps/quacktuaries/data
        target: /data
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:size=16777216,mode=1777,noexec,nosuid,nodev
    networks: [apps]

  bernoulli:
    <<: *runtime
    labels:
      sablier.enable: 'true'
      sablier.group: ${COMPOSE_PROJECT_NAME:-athenaeum}-bernoulli
    image: ${BERNOULLI_IMAGE:-valentemath/bernoulli:latest-athenaeum}
    user: ${RUNTIME_UID:-10001}:${RUNTIME_GID:-10001}
    mem_limit: 1g
    environment:
      APP_ENV: production
      ROOT_PATH: /bernoulli
      PORT: '8000'
      DB_PATH: /data/app.db
      SESSION_SECRET_FILE: /run/secrets/bernoulli_session
      ACCOUNT_SERVICE_URL: http://accounts:8000
      ATHENAEUM_APP_ID: bernoulli
      # Only our trusted containers can reach this unpublished app port.
      FORWARDED_ALLOW_IPS: '*'
    secrets: [bernoulli_session]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/srv/athenaeum}/apps/bernoulli/data
        target: /data
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:size=16777216,mode=1777,noexec,nosuid,nodev
    networks: [apps]

  srs:
    <<: *runtime
    labels:
      sablier.enable: 'true'
      sablier.group: ${COMPOSE_PROJECT_NAME:-athenaeum}-srs
    image: ${SRS_IMAGE:-valentemath/srs:latest-athenaeum}
    user: ${RUNTIME_UID:-10001}:${RUNTIME_GID:-10001}
    mem_limit: 1g
    environment:
      APP_ENV: production
      ROOT_PATH: /srs
      PORT: '8000'
      DB_PATH: /data/app.db
      SESSION_SECRET_FILE: /run/secrets/srs_session
      ACCOUNT_SERVICE_URL: http://accounts:8000
      ATHENAEUM_APP_ID: srs
      # Only our trusted containers can reach this unpublished app port.
      FORWARDED_ALLOW_IPS: '*'
    secrets: [srs_session]
    volumes:
      - type: bind
        source: ${DATA_ROOT:-/srv/athenaeum}/apps/srs/data
        target: /data
        bind: {create_host_path: false}
    tmpfs:
      - /tmp:size=16777216,mode=1777,noexec,nosuid,nodev
    networks: [apps]

networks:
  control:
    internal: true
  socket:
    internal: true
  apps:
    internal: true

secrets:
  accounts_session:
    file: ${ACCOUNTS_SECRET_FILE:-/etc/athenaeum/accounts-session-secret}
  quacktuaries_session:
    file: ${QUACKTUARIES_SECRET_FILE:-/etc/athenaeum/quacktuaries-session-secret}
  bernoulli_session:
    file: ${BERNOULLI_SECRET_FILE:-/etc/athenaeum/bernoulli-session-secret}
  srs_session:
    file: ${SRS_SECRET_FILE:-/etc/athenaeum/srs-session-secret}
