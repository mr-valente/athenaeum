provider:
  name: docker
  auto-stop-on-startup: false
  auto-warm-externally-started: true
  reject-unlabeled-requests: true
  verify-enabled-on-expiration: true
  docker:
    strategy: stop
server:
  port: 10000
sessions:
  # Routes set each app's session through its tier in deploy/caddy/apps.caddy.
  # This value reaches only an app Sablier finds already running (after a
  # deployment or its own restart) and the self-heal reseed: the shortest tier,
  # so nothing heavy is kept awake by accident; verify renews apps at their tier.
  default-duration: 1h
strategy:
  dynamic:
    custom-themes-path: /etc/sablier/themes
    default-theme: athenaeum
    show-details-by-default: false
    default-refresh-frequency: 5s
  blocking:
    default-timeout: 1m
